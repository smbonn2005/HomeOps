---
# yaml-language-server: $schema=https://cluster-schemas.smbonn.me/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vernemq
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vernemq-secret
    template:
      engineVersion: v2
      data:
        MQTT_USER: "{{ .MQTT_USER }}"
        MQTT_PASS: "{{ .MQTT_PASS }}"
        VERNEMQ_COOKIE: "{{ .MQTT_PASS | sha256sum }}"
  dataFrom:
    - extract:
        key: mosquitto
