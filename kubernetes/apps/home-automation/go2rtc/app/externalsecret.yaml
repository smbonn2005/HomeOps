---
# yaml-language-server: $schema=https://cluster-schemas.smbonn.me/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: go2rtc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: go2rtc-secret
    template:
      data:
        REOLINK_USERNAME: "{{ .REOLINK_USERNAME }}"
        REOLINK_PASSWORD: "{{ .REOLINK_PASSWORD }}"
        RTSP_USERNAME: "{{ .GO2RTC_RTSP_USERNAME }}"
        RTSP_PASSWORD: "{{ .GO2RTC_RTSP_PASSWORD }}"
  dataFrom:
    - extract:
        key: go2rtc
