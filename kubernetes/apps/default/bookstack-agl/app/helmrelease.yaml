---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bookstack-agl
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: bookstack-agl
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur
      namespace: storage
  values:
    controllers:
      bookstack-agl:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/bookstack
              tag: v26.09.2-ls292
            env:
              TZ: America/New_York
              PUID: 1000
              PGID: 1000
              APP_URL: https://airgoons.smbonn.me
              APP_PROXIES: 10.42.0.0/16
              DB_HOST: mariadb.databases.svc.cluster.local
              DB_PORT: 3306
              DB_DATABASE: "bookstack_agl"
              DB_USERNAME: "bookstack_agl"
            envFrom:
              - secretRef:
                  name: bookstack-agl-secret
            resources:
              requests:
                cpu: 10m
                memory: 50Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 80
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: https://raw.githubusercontent.com/smbonn2005/homeops/main/icons/bookstack.png
          gethomepage.dev/name: Bookstack AGL
          gethomepage.dev/group: Observability
          gethomepage.dev/description: Documentation and Wiki
        hostnames:
          - airgoons.smbonn.me
        parentRefs:
          - name: envoy-internal
            namespace: networking
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
