---
# yaml-language-server: $schema=https://cluster-schemas.smbonn.me/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookstack-agl
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bookstack-agl-secret
    template:
      engineVersion: v2
      data:
        APP_KEY: "{{ .BOOKSTACK_AGL_APP_KEY }}"
        DB_PASSWORD: "{{ .BOOKSTACK_AGL_MARIADB_PASSWORD }}"
        DISCORD_APP_ID: "{{ .BOOKSTACK_AGL_DISCORD_APP_ID }}"
        DISCORD_APP_SECRET: "{{ .BOOKSTACK_AGL_DISCORD_APP_SECRET }}"
  dataFrom:
    - extract:
        key: bookstack-agl
