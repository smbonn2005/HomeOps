---
# yaml-language-server: $schema=https://cluster-schemas.smbonn.me/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cross-seed
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cross-seed-secret
    template:
      engineVersion: v2
      data:
        PROWLARR_API_KEY: "{{ .PROWLARR_TOKEN }}"
        SONARR_API_KEY: "{{ .SONARR_TOKEN }}"
        RADARR_API_KEY: "{{ .RADARR_TOKEN }}"
        QBITTORRENT_USER: "{{ .QBITTORRENT_USER }}"
        QBITTORRENT_PASS: "{{ .QBITTORRENT_PASS }}"
  dataFrom:
    - extract:
        key: arr-stack
    - extract:
        key: qbittorrent
