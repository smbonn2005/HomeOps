---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      homepage:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.4.0@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61
            env:
              TZ: America/New_York
              HOMEPAGE_ALLOWED_HOSTS: home.smbonn.me
            envFrom:
              - secretRef:
                  name: homepage-secret
            resources:
              requests:
                cpu: 15m
                memory: 200M
              limits:
                memory: 2G
        pod:
          automountServiceAccountToken: true
    defaultExternalSecretStoreRef:
      kind: ClusterSecretStore
      name: onepassword-connect
    externalSecrets:
      main:
        target:
          name: homepage-secret
          template:
            engineVersion: v2
            data:
              HOMEPAGE_VAR_CLOUDFLARED_ACCOUNTID: "{{ .CLOUDFLARE_ACCOUNT_TAG }}"
              HOMEPAGE_VAR_CLOUDFLARED_TUNNELID: "{{ .CLOUDFLARE_TUNNEL_ID }}"
              HOMEPAGE_VAR_CLOUDFLARED_API_TOKEN: "{{ .CLOUDFLARE_API_TOKEN }}"
              HOMEPAGE_VAR_GRAFANA_USERNAME: "{{ .GRAFANA_USER }}"
              HOMEPAGE_VAR_GRAFANA_PASSWORD: "{{ .GRAFANA_PASS }}"
              HOMEPAGE_VAR_PTERODACTYL_KEY: "{{ .PTERODACTYL_API_TOKEN }}"
              HOMEPAGE_VAR_QBITTORRENT_USERNAME: "{{ .QBITTORRENT_USER }}"
              HOMEPAGE_VAR_QBITTORRENT_PASSWORD: "{{ .QBITTORRENT_PASS }}"
              HOMEPAGE_VAR_PLEX_KEY: "{{ .PLEX_API_TOKEN }}"
              HOMEPAGE_VAR_PROWLARR_KEY: "{{ .PROWLARR_TOKEN }}"
              HOMEPAGE_VAR_RADARR_KEY: "{{ .RADARR_TOKEN }}"
              HOMEPAGE_VAR_READARR_KEY: "{{ .READARR_TOKEN }}"
              HOMEPAGE_VAR_SONARR_KEY: "{{ .SONARR_TOKEN }}"
              HOMEPAGE_VAR_TAUTULLI_KEY: "{{ .TAUTULLI_TOKEN }}"
              HOMEPAGE_VAR_FS01_KEY: "{{ .FS01_TOKEN }}"
              HOMEPAGE_VAR_PFSENSE_USERNAME: "{{ .PFSENSE_USER }}"
              HOMEPAGE_VAR_PFSENSE_PASSWORD: "{{ .PFSENSE_PASS }}"
              HOMEPAGE_VAR_HASS_TOKEN: "{{ .HASS_TOKEN }}"
              HOMEPAGE_VAR_HASS_LATITUDE: "{{ .HASS_LATITUDE }}"
              HOMEPAGE_VAR_HASS_LONGITUDE: "{{ .HASS_LONGITUDE }}"
              HOMEPAGE_VAR_MEALIE_KEY: "{{ .MEALIE_TOKEN }}"
              HOMEPAGE_VAR_UNIFI_KEY: "{{ .UNIFI_API_KEY2 }}"
        dataFrom:
          - extract:
              key: cloudflare
          - extract:
              key: grafana
          - extract:
              key: pterodactyl
          - extract:
              key: qbittorrent
          - extract:
              key: plex
          - extract:
              key: arr-stack
          - extract:
              key: tautulli
          - extract:
              key: pfsense
          - extract:
              key: fs01
          - extract:
              key: home-assistant
          - extract:
              key: mealie
          - extract:
              key: unifi
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 3000
    route:
      app:
        hostnames:
          - home.smbonn.me
        parentRefs:
          - name: envoy-internal
            namespace: networking
    persistence:
      config:
        enabled: true
        type: configMap
        name: homepage-config
        globalMounts:
          - subPath: bookmarks.yaml
            path: /app/config/bookmarks.yaml
          - subPath: docker.yaml
            path: /app/config/docker.yaml
          - subPath: kubernetes.yaml
            path: /app/config/kubernetes.yaml
          - subPath: services.yaml
            path: /app/config/services.yaml
          - subPath: settings.yaml
            path: /app/config/settings.yaml
          - subPath: widgets.yaml
            path: /app/config/widgets.yaml
