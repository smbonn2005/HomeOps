---
# yaml-language-server: $schema=https://cluster-schemas.smbonn.me/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-mcp-secret
    template:
      data:
        MCP_GRAFANA_SERVER_TOKEN: "{{ .GRAFANA_MCP_TOKEN }}"
  dataFrom:
    - extract:
        key: grafana-mcp
