---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

endpoints:
  - name: Cloudflare
    group: connectivity
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Google
    group: connectivity
    url: icmp://8.8.8.8
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Quad9
    group: connectivity
    url: icmp://9.9.9.9
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: NAS SMB
    group: services
    url: https://192.168.1.4/api/v2.0/service?service=cifs
    interval: 1m
    client:
      insecure: true
    headers:
      Authorization: Bearer ${FS01_TOKEN}
    conditions:
      - "[STATUS] == 200"
      - "[BODY][0].state == RUNNING"
      - "[BODY][0].enable == true"

metrics: true

storage:
  type: postgres
  path: postgres://${INIT_POSTGRES_USER}:${INIT_POSTGRES_PASS}@${INIT_POSTGRES_HOST}:5432/${INIT_POSTGRES_DBNAME}?sslmode=disable
  caching: true

ui:
  title: Status | Gatus
  header: Status
  logo: https://raw.githubusercontent.com/smbonn2005/homeops/main/icons/smb.jpg
  link: https://github.com/smbonn2005
  buttons:
    - name: Github
      link: https://github.com/smbonn2005
    - name: Homelab
      link: https://github.com/smbonn2005/HomeOps

web:
  port: ${GATUS_WEB_PORT}
