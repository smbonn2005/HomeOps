---
# yaml-language-server: $schema=https://cluster-schemas.smbonn.me/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unifi-mcp-secret
    template:
      data:
        UNIFI_USERNAME: "{{ .UNIFI_MCP_USERNAME }}"
        UNIFI_PASSWORD: "{{ .UNIFI_MCP_PASSWORD }}"
        UNIFI_API_KEY: "{{ .UNIFI_API_KEY }}"
        UNIFI_MCP_HTTP_AUTH_TOKEN: "{{ .UNIFI_MCP_TOKEN }}"
  dataFrom:
    - extract:
        key: unifi
    - extract:
        key: unifi-mcp
