---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: unifi-mcp
  values:
    controllers:
      network:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/sirkirby/unifi-network-mcp
              tag: 0.45.0@sha256:5c14d804e23b714850b58c4b45b722aeed9159d0acf47b182a3bfa92d2d17e7c
            env:
              UNIFI_HOST: &unifiHost 192.168.10.1
              UNIFI_MCP_HTTP_ENABLED: "true"
              UNIFI_MCP_HTTP_TRANSPORT: streamable-http
              UNIFI_MCP_HOST: 0.0.0.0
              UNIFI_MCP_PORT: &networkPort 3000
              UNIFI_MCP_ALLOWED_HOSTS: &networkHost unifi-network-mcp.smbonn.me
            envFrom: &envFrom
              - secretRef:
                  name: unifi-mcp-secret
            probes: &probes
              liveness: &probe
                enabled: true
                type: TCP
              readiness: *probe
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources: &resources
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
      protect:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/sirkirby/unifi-protect-mcp
              tag: 0.13.0@sha256:812460e66b7c9fe2643ca52f1d04434560b9df90db643b0facb531bd09e7c51f
            env:
              UNIFI_HOST: *unifiHost
              UNIFI_MCP_HTTP_ENABLED: "true"
              UNIFI_MCP_HTTP_TRANSPORT: streamable-http
              UNIFI_MCP_HOST: 0.0.0.0
              UNIFI_MCP_PORT: &protectPort 3001
              UNIFI_MCP_ALLOWED_HOSTS: &protectHost unifi-protect-mcp.smbonn.me
              HOME: /tmp
            envFrom: *envFrom
            probes: *probes
            securityContext: *securityContext
            resources: *resources
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          protect:
            app:
              - path: /tmp
    service:
      network:
        controller: network
        ports:
          http:
            port: *networkPort
      protect:
        controller: protect
        ports:
          http:
            port: *protectPort
    route:
      network:
        hostnames: [*networkHost]
        parentRefs: &parentRefs
          - name: envoy-internal
            namespace: networking
        rules:
          - matches: &matches
              - path:
                  type: PathPrefix
                  value: /mcp
            backendRefs:
              - identifier: network
                port: *networkPort
      protect:
        hostnames: [*protectHost]
        parentRefs: *parentRefs
        rules:
          - matches: *matches
            backendRefs:
              - identifier: protect
                port: *protectPort
