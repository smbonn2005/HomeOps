---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app doplarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn:
    - name: sonarr
      namespace: media
    - name: radarr
      namespace: media
  values:
    controllers:
      doplarr:
        containers:
          app:
            image:
              repository: ghcr.io/activexray/doplarr_rs
              tag: v4.6.0@sha256:3487e7193f14f8f7e290c69e9355a5ded548853ffa18b62178486ca33ce76820
            envFrom:
              - secretRef:
                  name: doplarr-secret
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 500Mi
    defaultExternalSecretStoreRef:
      kind: ClusterSecretStore
      name: onepassword-connect
    externalSecrets:
      main:
        target:
          name: doplarr-secret
          template:
            engineVersion: v2
            data:
              SONARR__URL: "{{ .SONARR_URL }}"
              RADARR__URL: "{{ .RADARR_URL }}"
              SONARR__API: "{{ .SONARR_TOKEN }}"
              RADARR__API: "{{ .RADARR_TOKEN }}"
              DISCORD__TOKEN: "{{ .DOPLARR_TOKEN }}"
        dataFrom:
          - extract:
              key: arr-stack
    service:
      app:
        controller: *app
        enabled: false
