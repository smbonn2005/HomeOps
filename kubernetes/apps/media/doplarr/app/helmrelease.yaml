---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app doplarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: doplarr
  dependsOn:
    - name: sonarr
      namespace: media
    - name: radarr
      namespace: media
  values:
    controllers:
      doplarr:
        containers:
          app:
            image:
              repository: ghcr.io/activexray/doplarr_rs
              tag: v4.7.0@sha256:982c1782c751d5c71829d9b94a12fb283ab9e74072791d2b15789ef6ff83bdda
            envFrom:
              - secretRef:
                  name: doplarr-secret
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 500Mi
    service:
      app:
        controller: *app
        enabled: false
