---
# yaml-language-server: $schema=https://cluster-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mysql
  namespace: &namespace databases
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/defaults
  dependsOn:
    - name: external-secrets-stores
      namespace: kube-system
    - name: kopiur-repository
      namespace: storage
  path: ./kubernetes/apps/databases/mysql/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: false # no flux ks dependents
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 20Gi
      # mysql official image runs mysqld as uid/gid 999, not kopiur's 1000 default;
      # mismatch fails snapshots reading mysqld's 0600 auto-generated key files (server-key.pem etc)
      KOPIUR_PUID: "999"
      KOPIUR_PGID: "999"
