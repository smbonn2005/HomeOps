---
# yaml-language-server: $schema=https://cluster-schemas.smbonn.me/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kguardian
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.29.2
  url: oci://ghcr.io/kguardian-dev/charts/kguardian
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: '^https://token.actions.githubusercontent.com$'
        subject: '^https://github.com/kguardian-dev/kguardian/.github/workflows/charts-release.yaml@refs/tags/chart/v.*$'
