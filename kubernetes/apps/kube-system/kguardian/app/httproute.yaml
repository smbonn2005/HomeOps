---
# yaml-language-server: $schema=https://cluster-schemas.smbonn.me/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kguardian
spec:
  hostnames:
    - kguardian.smbonn.me
  parentRefs:
    - name: envoy-internal
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: kguardian-llm-bridge
          port: 8080
    - backendRefs:
        - name: kguardian-frontend
          port: 5173
