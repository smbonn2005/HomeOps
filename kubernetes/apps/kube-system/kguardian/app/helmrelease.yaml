---
# yaml-language-server: $schema=https://cluster-schemas.smbonn.me/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kguardian
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kguardian-llm-bridge
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kguardian-llm-bridge
                annotations:
                  secret.reloader.stakater.com/reload: kguardian-mcp-secret
  values:
    telemetry:
      enabled: false
    broker:
      metrics:
        serviceMonitor:
          enabled: true
    evaluator:
      metrics:
        serviceMonitor:
          enabled: true
    frontend:
      allowedHosts:
        - kguardian.smbonn.me
    ai:
      enabled: true
      mcp:
        enabled: true
        auth:
          existingSecret: kguardian-mcp-secret
