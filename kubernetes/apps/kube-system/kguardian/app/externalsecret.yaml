---
# yaml-language-server: $schema=https://cluster-schemas.smbonn.me/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kguardian
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kguardian-mcp-secret
    template:
      data:
        token: "{{ .KGUARDIAN_MCP_TOKEN }}"
  dataFrom:
    - extract:
        key: kguardian
