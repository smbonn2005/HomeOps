---
# yaml-language-server: $schema=https://cluster-schemas.smbonn.me/kubevirt.io/kubevirt_v1.json
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  configuration:
    developerConfiguration:
      featureGates:
        - LiveMigration
        - NetworkBindingPlugins
    smbios:
      family: ccio
      manufacturer: Talos Virtualization
      product: talosvm
      sku: TalosCloud
      version: v0.1.0
  customizeComponents:
    patches:
      # Increases leader election timeouts to survive etcd compaction spikes.
      - patch: '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--leader-elect-lease-duration"},{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"60s"},{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--leader-elect-renew-deadline"},{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"40s"},{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--leader-elect-retry-period"},{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"10s"}]'
        resourceName: virt-controller
        resourceType: Deployment
        type: json
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
