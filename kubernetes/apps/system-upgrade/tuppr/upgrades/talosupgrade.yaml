---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.13.9
  policy:
    debug: true
    rebootMode: powercycle
  healthChecks:
    - # No active Kopiur snapshots
      apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: status.phase != 'Running'
    - # No active Kopiur restores
      apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      expr: |-
        !(status.phase in ['Resolving', 'Restoring'])
    - # Ceph cluster is Healthy
      apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: status.ceph.health in ['HEALTH_OK']
